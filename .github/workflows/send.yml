# Vercel Hobby runs cron at most once a day, UTC only — not enough to send in
# each recipient's local morning. This polls the queue hourly instead; /api/send
# decides who is actually in-window and enforces the daily cap, so an extra run
# is harmless.
name: Send queue

on:
  schedule:
    - cron: "0 * * * *"
  # Manual trigger, for testing without waiting for the hour.
  workflow_dispatch:

# A slow run must not stack up behind the next hour's.
concurrency:
  group: send-queue
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger send
        run: |
          curl -sS --fail-with-body \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/send"
